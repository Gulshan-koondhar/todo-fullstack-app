apiVersion: v1
kind: Service
metadata:
  name: todo-backend-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: todo-backend